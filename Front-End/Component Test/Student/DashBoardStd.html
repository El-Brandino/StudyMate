<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="DashboardStd.css">
    <title>Document</title>
</head>

<body>
    <section class="main-dashboard">
        <div class="greeting-card">
            <h2>Selamat, pagi Brandon!!</h2>
            <p>Semangat belajarnya hari ini!</p>
        </div>
        <div class="stats-grid">
            <div class="stats-card">
                <div class="icon-box" id="clipboard">
                    <img src="/src/assets/icons/clipboard.svg" alt="">
                </div>
                <div>
                    <strong>0</strong>
                    <small>Total Tugas</small>
                </div>
            </div>
            <div class="stats-card">
                <div class="icon-box" id="checked">
                    <img src="/src/assets/icons/checked.svg" alt="">
                </div>
                <div>
                    <strong>0</strong>
                    <small>Selesai</small>
                </div>
            </div>
            <div class="stats-card">
                <div class="icon-box" id="clock">
                    <img src="/src/assets/icons/clock.svg" alt="">
                </div>
                <div>
                    <strong>0</strong>
                    <small>Deadline Minggu ini</small>
                </div>
            </div>
            <div class="stats-card">
                <div class="icon-box" id="book">
                    <img src="/src/assets/icons/book.svg" alt="">
                </div>
                <div>
                    <strong>0</strong>
                    <small>Total Mata pelajaran</small>
                </div>
            </div>
        </div>
        <div class="progress-div">
            <div class="progress-header">
                <h3>Progres Tugas</h3>
                <span>0%</span>
            </div>
            <div class="progress-bar"></div>
        </div>
        <div class="dashboard-info">
            <div class="card-info">
                <div class="card-info-header">
                    <h3>Jadwal Hari Ini</h3>
                </div>
                <div class="card-info-view"></div>
            </div>
            <div class="card-info">
                <div class="card-info-header">
                    <h3>Tugas Terbaru</h3>
                    <a href="">Lihat Semua</a>
                </div>
                <div class="card-info-view"></div>
            </div>
        </div>
    </section>
</body>

</html>
