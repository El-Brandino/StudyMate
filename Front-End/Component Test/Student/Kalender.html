<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender - StudyMate</title>
    <link rel="stylesheet" href="Kalender.css">
</head>
<body>
    <div class="kalender-container">
        <div class="kalender-header">
            <h1>Kalender</h1>
            <div class="kalender-nav">
                <button class="nav-btn" id="prevBtn">◀</button>
                <div class="month-year">
                    <h2 id="monthYear">September 2026</h2>
                </div>
                <button class="nav-btn" id="nextBtn">▶</button>
            </div>
        </div>

        <div class="kalender-content">
            <div class="kalender-main">
                <div class="calendar-grid-container">
                    <div class="day-headers">
                        <div class="day-header">Min</div>
                        <div class="day-header">Sen</div>
                        <div class="day-header">Sel</div>
                        <div class="day-header">Rab</div>
                        <div class="day-header">Kam</div>
                        <div class="day-header">Jum</div>
                        <div class="day-header">Sab</div>
                    </div>

                    <div class="calendar-grid" id="calendarGrid">
                        <!-- Calendar days akan diisi oleh JavaScript -->
                    </div>
                </div>
            </div>

            <aside class="deadline-sidebar">
                <h3>Deadline Terdekat</h3>
                <div class="deadline-list">
                    <div class="empty-state">
                        <p>Belum ada deadline.</p>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        const monthNames = [
            "Januari", "Februari", "Maret", "April", "Mei", "Juni",
            "Juli", "Agustus", "September", "Oktober", "November", "Desember"
        ];

        let currentDate = new Date(2026, 8, 1); // September 1, 2026

        function getDaysInMonth(date) {
            return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
        }

        function getFirstDayOfMonth(date) {
            return new Date(date.getFullYear(), date.getMonth(), 1).getDay();
        }

        function isToday(day) {
            const today = new Date();
            return (
                day === today.getDate() &&
                currentDate.getMonth() === today.getMonth() &&
                currentDate.getFullYear() === today.getFullYear()
            );
        }

        function renderCalendar() {
            const monthYear = document.getElementById('monthYear');
            monthYear.textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;

            const calendarGrid = document.getElementById('calendarGrid');
            calendarGrid.innerHTML = '';

            const daysInMonth = getDaysInMonth(currentDate);
            const firstDay = getFirstDayOfMonth(currentDate);

            // Empty cells
            for (let i = 0; i < firstDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'calendar-day empty';
                calendarGrid.appendChild(emptyDay);
            }

            // Days
            for (let day = 1; day <= daysInMonth; day++) {
                const dayElement = document.createElement('div');
                const classes = ['calendar-day', 'has-day'];
                if (isToday(day)) {
                    classes.push('today');
                }
                dayElement.className = classes.join(' ');
                dayElement.textContent = day;
                calendarGrid.appendChild(dayElement);
            }
        }

        function handlePrevMonth() {
            currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1);
            renderCalendar();
        }

        function handleNextMonth() {
            currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1);
            renderCalendar();
        }

        document.getElementById('prevBtn').addEventListener('click', handlePrevMonth);
        document.getElementById('nextBtn').addEventListener('click', handleNextMonth);

        // Initial render
        renderCalendar();
    </script>
</body>
</html>
