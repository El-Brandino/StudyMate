<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - StudyMate</title>
    <link rel="stylesheet" href="Profil.css">
</head>
<body>
    <div class="profil-container">
        <div class="profil-card">
            <!-- Left Section - Profile Info -->
            <div class="profil-left">
                <div class="avatar-section">
                    <div class="avatar-circle">
                        <img src="/src/assets/empty-state/PlaceHolder.png" alt="Avatar" class="avatar-img">
                    </div>
                    <h2 class="profil-name">Brandon</h2>
                    <p class="profil-kelas">Siswa • XI RPL 2</p>
                    <button class="ganti-foto-btn">Ganti Foto</button>
                    <p class="foto-info">Format: JPG, JPEG, PNG, WEBP<br/>(Maks. 2MB)</p>
                </div>
            </div>

            <!-- Divider -->
            <div class="profil-divider"></div>

            <!-- Right Section - Data Profil -->
            <div class="profil-right">
                <h3 class="data-profil-title">Data Profil</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nama</label>
                        <input type="text" id="nama" value="Brandon" placeholder="Nama Lengkap">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" value="bspw.2010@gmail.com" placeholder="Email">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label>Nomor HP</label>
                    <input type="tel" id="nomorHP" placeholder="Nomor Telepon">
                </div>

                <div class="form-group full-width">
                    <label>Alamat</label>
                    <input type="text" id="alamat" placeholder="Alamat Lengkap">
                </div>

                <div class="form-group full-width">
                    <label>Bio</label>
                    <textarea id="bio" placeholder="Tuliskan bio Anda di sini..." rows="6"></textarea>
                </div>

                <div class="form-actions">
                    <button class="btn-simpan" onclick="simpanProfil()">Simpan</button>
                    <button class="btn-ubah-password">Ubah Password</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function simpanProfil() {
            const profileData = {
                nama: document.getElementById('nama').value,
                email: document.getElementById('email').value,
                nomorHP: document.getElementById('nomorHP').value,
                alamat: document.getElementById('alamat').value,
                bio: document.getElementById('bio').value
            };
            console.log('Data tersimpan:', profileData);
            alert('Profil berhasil disimpan!');
        }
    </script>
</body>
</html>
